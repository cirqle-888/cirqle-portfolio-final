<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://cdn.contentful.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.contentful.com" />

    <!-- Google Fonts preconnect (avoids render-blocking @import in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&display=swap" /></noscript>

    <!-- Title -->

    <title>Creative Design Agency | Graphic Design, Video &amp; Social Media | Cirqle</title>

    <!-- SEO Description -->

    <meta
      name="description"
      content="Cirqle is a creative design agency working with brands worldwide, offering graphic design, video production, social media content, Meta Ads, and brand identity services. Premium quality, fast delivery."
    />

    <!-- Favicon -->

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph (for social media preview) -->

    <meta property="og:title" content="Creative Design Agency | Graphic Design, Video &amp; Social Media | Cirqle" />
    <meta property="og:description" content="Cirqle is a creative design agency working with brands worldwide, offering graphic design, video production, social media content, Meta Ads, and brand identity services." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cirqle.work" />
    <meta property="og:image" content="https://cirqle.work/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cirqle.work" />

    <!-- Theme Color -->

    <meta name="theme-color" content="#7C5CFF" />

    <!-- Apply saved theme before first paint (no flash). Default: light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cirqle-theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0E0C15");
          }
        } catch (e) {}
      })();
    </script>

    <!-- LocalBusiness Structured Data -->

    <script type="application/ld+json">

      "email": "team@cirqle.work",
      "telephone": "+918301839488",
      "areaServed": "Worldwide",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Creative Services",
        "itemListElement": [
          {
            "@type": "Offer",

              "@type": "Service",

            }
          },
          {
            "@type": "Offer",

            }
          },
          {
            "@type": "Offer",

            }
          },

          },
          {

            }
          }
        ]
      },
      "sameAs": [
        "https://www.instagram.com/cirqle.work",

  </head>

  <body>
    <div id="root"></div>

    <!-- React Entry -->

</html>
